_version: 2
message.app_launcher_name:
  en: "%{app_name} Launcher"
  zh-CN: "%{app_name} 启动器"
  zh-TW: "%{app_name} 啟動器"
  es: "Lanzador de %{app_name}"
  ja: "%{app_name} ランチャー"
  ko: "%{app_name} 런처"
message.new_version:
  en: "New version available %{version}, please choose whether to update, or enable auto update in settings."
  zh-CN: "发现新版本 %{version}, 请选择是否更新, 或在设置中打开自动更新."
  zh-TW: "發現新版本 %{version}，請選擇是否更新，或在設定中啟用自動更新。"
  es: "Nueva versión %{version} disponible, elija si desea actualizar o active la actualización automática en la configuración."
  ja: "新バージョン %{version} が利用可能です。更新するか、設定で自動更新を有効にするかを選択してください。"
  ko: "새 버전 %{version}이 있습니다. 업데이트하거나 설정에서 자동 업데이트를 활성화하세요."
message.new_version_update:
  en: "New version available %{version}, starting to auto update."
  zh-CN: "发现新版本 %{version}, 开始自动更新."
  zh-TW: "發現新版本 %{version}，開始自動更新。"
  es: "Nueva versión %{version} disponible, iniciando actualización automática."
  ja: "新バージョン %{version} が利用可能です。自動更新を開始します。"
  ko: "새 버전 %{version}이 있습니다. 자동 업데이트를 시작합니다."
message.version_update_success:
  en: "Successfully updated to %{version}."
  zh-CN: "成功更新到 %{version}."
  zh-TW: "成功更新至 %{version}。"
  es: "Se actualizó correctamente a %{version}."
  ja: "%{version} への更新に成功しました。"
  ko: "%{version}(으)로 성공적으로 업데이트되었습니다."
message.pip_network_error:
  en: "Could not download Python packages from the package index (%{index}). Check your network connection, or switch to another pip mirror in Settings and try again."
  zh-CN: "无法从软件包索引（%{index}）下载 Python 包。请检查网络连接，或在设置中切换到其他 pip 镜像源后重试。"
  zh-TW: "無法從套件索引（%{index}）下載 Python 套件。請檢查網路連線，或在設定中切換到其他 pip 鏡像來源後重試。"
  es: "No se pudieron descargar los paquetes de Python desde el índice de paquetes (%{index}). Revisa tu conexión de red, o cambia a otro espejo de pip en Configuración e inténtalo de nuevo."
  ja: "パッケージインデックス (%{index}) から Python パッケージをダウンロードできませんでした。ネットワーク接続を確認するか、設定で別の pip ミラーに切り替えてもう一度お試しください。"
  ko: "패키지 인덱스(%{index})에서 Python 패키지를 내려받을 수 없습니다. 네트워크 연결을 확인하거나, 설정에서 다른 pip 미러로 바꾼 뒤 다시 시도하세요."
